<div class="mainpart mt-5 pt-5">
    <button class="btn d-flex justify-content-start opacity mb-md-3">
        <img src="../../wolfpack/Assets/Images/Support/Questions.png" class="col-md-7 col-6 blink-btn" alt="">
    </button>
    <!-- --------------------------------------- Support-1 -------------------------------------- -->
    <div class="row mb-2 booster-1 opacity align-items-center gap-3 gap-md-0 justify-content-between">
        <div class="col-md-5 col-11 ">
            <p class="fs-64 heading mb-md-5 w-100" data-aos="fade-up" data-aos-duration="1500"
                style="line-height: normal;">Have a Question for the Wolfpack Team?</p>
            <p class="text-secondary fs-18 mb-30 w-100" data-aos="fade-up" data-aos-duration="1500">We’re here to
                help!
                Please fill in the contact form and we’ll be in touch within 1-2 business days. Our regular business
                hours are Monday to Friday, 9am – 5pm PST.</p>
            <!-- <button data-aos="fade-up" data-aos-duration="1500" class="btn-orange glow-button submit-btn btn-2">Join our
                Waitlist</button> -->
        </div>
        <div class="col-md-6 col-12">
            <img src="../../wolfpack/Assets/Images/Support/Support1.png"  height="414px" alt="">
        </div>

        <form action="" onsubmit="support(event)">
            <div class="d-flex mt-md-3 p-0 align-items-center flex-md-row flex-column gap-3">
                <div class="row col-md-6 col-12" data-aos="fade-up" data-aos-duration="1500">
                    <span class="text-secondary col-12 mb-1 ">Full Name <span style="color: red;">*</span></span>
                    <div class="input-container px-0 pe-md-3 col-12">
                        <i class="fa-regular fa-user" style="color: #ffffff; font-size: larger; left: 3%;"></i>
                        <input fs-6 type="text" class="input col-12 fs-6  me-md-3  me-0" placeholder="Full Name">
                    </div>
                </div>
                <div class="row col-md-6 col-12" data-aos="fade-up" data-aos-duration="1500">
                    <span class="text-secondary col-12 mb-1 ">Email<span style="color: red;">*</span></span>
                    <div class="input-container px-0  col-12">
                        <i class="fa-regular fa-envelope"
                            style="color: #ffffff; top: 17px; font-size: larger;  left: 3%;"></i>
                        <input fs-6 type="email" class="input col-12 fs-6  me-md-3 " placeholder="Email">
                    </div>
                </div>
            </div>
            <div class="col-12" data-aos="fade-up" data-aos-duration="1500">
                <span class="text-secondary col-12">Message <span style="color: red;">*</span></span>
                <div class="input-container mt-1 px-0 col-12">
                    <svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M13.2603 3.59997L5.05034 12.29C4.74034 12.62 4.44034 13.27 4.38034 13.72L4.01034 16.96C3.88034 18.13 4.72034 18.93 5.88034 18.73L9.10034 18.18C9.55034 18.1 10.1803 17.77 10.4903 17.43L18.7003 8.73997C20.1203 7.23997 20.7603 5.52997 18.5503 3.43997C16.3503 1.36997 14.6803 2.09997 13.2603 3.59997Z"
                            stroke="white" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M11.8896 5.04999C12.3196 7.80999 14.5596 9.91999 17.3396 10.2" stroke="white"
                            stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M3 22H21" stroke="white" stroke-width="1.5" stroke-miterlimit="10"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <textarea fs-6 type="text" class="input col-12 fs-6  me-md-3 " style="border-radius: 20px ;"></textarea>
                </div>
            </div>
            <button id="supportSubmitBtn" class="btn-orange glow-button fs-6 submit-btn btn-2" style="padding: 13px 74px !important;" data-aos="fade-up"
                    data-aos-duration="1500" type="submit">Submit</button>

        </form>
    </div>

</div>
